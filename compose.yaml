# One image serves both roles. "app" runs detection cycles (mirador run);
# "api" serves the HTTP API (mirador serve). They never talk to each other --
# all shared state lives in Postgres, so splitting them costs nothing.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Exposed to the host only so you can point a local psql/GUI client at
      # it during dev. The app talks to "db:5432" over the compose network,
      # not through this mapping.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    command: ["mirador", "run"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./out:/app/out
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    command: ["mirador", "serve"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MIRADOR_API_TOKEN: ${MIRADOR_API_TOKEN}
      MIRADOR_HTTP_ADDR: ${MIRADOR_HTTP_ADDR}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
